spring.application.name=KinderERP
spring.main.banner-mode=off

# SQLite via Hibernate; the schema is owned by Flyway (src/main/resources/db/migration)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration

# Log file in the app data folder (path set at startup by AppPaths.init)
logging.file.name=${kindererp.log.file:}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
